name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Unzip project
        run: |
          mkdir -p unpacked
          unzip -o monowire-forge-1.20.1.zip -d unpacked
          echo "Files in archive:"
          find unpacked -maxdepth 3 | head -50

      - name: Build
        run: |
          BUILD_FILE=$(find unpacked -name build.gradle -not -path '*/build/*' | head -1)
          if [ -z "$BUILD_FILE" ]; then echo "build.gradle not found in archive"; exit 1; fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project folder: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle build --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: monowire-jar
          path: out/*.jar
